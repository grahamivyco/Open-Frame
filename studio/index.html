<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio · Open Frame</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111110;--ink2:#4b4a46;--muted:#84827b;--cream:#f3f1ea;--line:rgba(0,0,0,.10);--r:#f24333;--b:#2f6bf0;--y:#f4bf3a;--g:#33ac66;
    /* site tokens (same values as index.html) */
    --bg:#fff;--line-2:rgba(0,0,0,.18);--gutter:clamp(18px,4.5vw,76px);--rad:20px;--rad-lg:30px;
    --head:calc(clamp(84px,9vh,102px) + 12px);--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
  .hub{max-width:560px;margin:0 auto;padding:calc(var(--head) + env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom))}
  /* signed out: a full-screen bento like the site's deck pages. Sign-in card (cream) + Bauhaus tile art, 50/50 */
  .stage{height:100svh;height:100dvh;min-height:560px;max-width:2200px;margin:0 auto;padding:calc(var(--head) + env(safe-area-inset-top)) var(--gutter) var(--gutter);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,1.4vw,18px)}
  .sign{background:var(--cream);border-radius:var(--rad-lg);padding:clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:auto}
  .sign>*{width:100%;max-width:440px}
  .sign .eyebrow{display:inline-flex;align-items:center;gap:9px;font:500 12px/1 Inter,sans-serif;letter-spacing:.2em;color:var(--muted);margin-bottom:16px}
  .sign .eyebrow svg{width:.8em;height:.8em;fill:var(--r)}
  .sign h1{font:500 clamp(2.4rem,4.4vw,3.8rem)/1 Fraunces,serif;letter-spacing:-.02em;margin-bottom:14px}
  .sign h1 em{font-weight:400}
  .sign .lead{color:var(--ink2);font-size:clamp(1.02rem,1.3vw,1.14rem);margin-bottom:clamp(22px,3.4vh,34px)}
  .sign input{border:1px solid var(--line-2);margin-bottom:12px;transition:border-color .25s,box-shadow .25s}
  .sign input:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(47,107,240,.16)}
  .sign button.yes{width:100%;border-color:var(--ink);transition:background .16s,border-color .16s}
  .sign button.yes:hover:not(:disabled){background:var(--r);border-color:var(--r)}
  .sign .skip{margin:16px 0 0;padding:6px 0;text-align:left}
  .sign .gsi{justify-content:flex-start;margin-bottom:16px;overflow:hidden}
  /* Google's button can't be wider than 400px, so the email column stops there too and everything lines up */
  .sign .gsi,.sign .or,.sign form{max-width:400px}
  .sign .or{display:flex;align-items:center;gap:12px;text-align:left;margin:0 0 14px!important}
  .sign .or::before,.sign .or::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .art{position:relative;border-radius:var(--rad-lg);overflow:hidden;background:var(--cream);min-height:0}
  .art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  @media (max-width:820px){
    .stage{grid-template-columns:1fr}
    .art{display:none}
    .sign{justify-content:center}
  }
  @media (max-height:600px){.stage{height:auto}}
  .shead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .shead .who{flex:1;min-width:0}
  .eyebrow{font:600 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
  .shead h1{font:500 22px/1.2 Fraunces,serif;margin-top:4px;overflow-wrap:anywhere}
  .count{font-size:14px;color:var(--ink2);white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{flex:1;padding:10px 4px;font-size:14px;border-color:var(--line);background:transparent;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:#fff;border-color:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
  .label{font-size:13px;color:var(--ink2);margin-bottom:12px}.label b{color:var(--ink);font-weight:600}
  .media{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -4px 14px;padding:0 4px}
  .media img,.media video{width:100%;max-height:460px;object-fit:contain;border-radius:12px;background:#ebe7dc;flex:none;scroll-snap-align:center}
  .media.many img,.media.many video,.media.many figure{width:86%;flex:none}
  .text{white-space:pre-wrap;font-size:15px;margin-bottom:8px;overflow-wrap:anywhere}
  .quote{background:var(--cream);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:15px;margin:8px 0;overflow-wrap:anywhere}
  .note{background:#fdf3d8;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
  a,.link{color:var(--ink)}
  .ask{font:500 19px/1.3 Fraunces,serif;margin:16px 0 12px}
  .ask:empty{margin:8px 0 0}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:500 16px/1.2 Inter,sans-serif;border-radius:100px;padding:15px 12px;cursor:pointer;border:1px solid var(--ink);background:#fff;color:var(--ink)}
  button.yes{background:var(--ink);color:var(--cream)}
  button:disabled{opacity:.5;cursor:default}
  .skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink2);font-size:14px;padding:6px;text-decoration:underline}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line-2);border-radius:14px;margin-bottom:12px;background:#fff;color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--ink)}
  input.code{font:500 28px/1 Fraunces,serif;letter-spacing:.3em;text-align:center}
  .done{text-align:center;padding:40px 20px}
  .done h2{font:500 26px/1.2 Fraunces,serif;margin-bottom:8px}
  .done h2 em{font-weight:400}
  .done p{color:var(--ink2)}
  .gsi{display:flex;justify-content:center;margin-bottom:14px;min-height:44px}
  .or{text-align:center;font-size:13px;color:var(--muted)!important;margin:0 0 12px!important}
  .err{color:var(--r);font-size:14px;margin:-4px 0 12px}
  .more,#results{margin-top:24px;font-size:15px;color:var(--ink2)}
  .more>p{margin-bottom:8px}
  .mute{color:var(--muted);font-size:14px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
  .tile b{display:block;font:500 24px/1.2 Fraunces,serif;color:var(--ink)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .row span:first-child{min-width:0;overflow-wrap:anywhere}
  .sect .row>:last-child{flex:none;white-space:nowrap;text-align:right}
  .sect{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
  .sect h3{font:500 19px/1.25 Fraunces,serif;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .sect h3 i{width:9px;height:9px;border-radius:50%;flex:none}
  .sect .row:first-of-type{border-top:0}
  /* client Project cards (Hub "Projects" tab): step bar, Graham's note, next from me / need from you */
  #projects{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
  #projects:empty{display:none}
  .proj{display:flex;flex-direction:column;gap:12px}
  .proj .label{margin:0}
  .pbar,.pnames{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
  .pbar i{height:6px;border-radius:3px;background:#eceae1}
  .pbar i.on{background:var(--ink)}
  .pbar i.now{background:var(--y)}
  .pnames{margin-top:-6px;font-size:11px;color:var(--muted)}
  .pnames span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pnames .here{color:var(--ink);font-weight:600}
  .pnote{font:500 19px/1.3 Fraunces,serif;overflow-wrap:anywhere}
  .prow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
  .prow>span:first-child{color:var(--ink2);font-size:14px}
  .prow>span:last-child{overflow-wrap:anywhere}
  .plink{align-self:flex-start;font-size:14px;font-weight:500;padding:6px 0}
  @media (max-width:380px){.prow{grid-template-columns:1fr;gap:2px}}
  .big{font:500 30px/1.1 Fraunces,serif;color:var(--ink)}
  footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
  footer a,footer button{color:var(--muted);font-size:13px}
  footer button{background:none;border:0;padding:4px;text-decoration:underline}
  #reels,#status{margin-top:4px}
  .lights{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--g)}
  .dot.fixing{background:var(--y)}.dot.fail{background:var(--r)}.dot.off,.dot.stale{background:var(--muted)}
  .lights span:last-child{margin-left:auto;color:var(--ink2);font-size:14px}
  .h2{font:500 22px/1.2 Fraunces,serif;margin:22px 0 10px}
  .h2 em{font-weight:400;font-style:italic}
  .types{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .types button{flex:none;padding:9px 14px;font-size:14px;border-color:var(--line);background:transparent}
  .types button[aria-selected="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .types b{font-weight:600;opacity:.6;margin-left:4px}
  .script{margin-bottom:12px}
  .script h3{font:500 21px/1.2 Fraunces,serif;margin-bottom:10px}
  .script h3 em{font-style:italic;color:var(--r)}
  .lines{white-space:pre-wrap;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
  .lines.short{max-height:11.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
  .more-btn{background:none;border:0;padding:6px 0;font-size:14px;color:var(--ink2);text-decoration:underline}
  .cap{font-size:14px;color:var(--ink2);white-space:pre-wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:12px;background:var(--cream);border-radius:100px;padding:3px 10px;margin-bottom:8px;color:var(--ink2)}
  .tag.y{background:#fdf3d8}
  .ask-new{width:100%;margin:2px 0 14px;background:var(--r);border-color:var(--r);color:#fff}
  .ask-new:disabled{background:#fff;color:var(--ink2);border-color:var(--line);opacity:1}
  .draft video{width:100%;aspect-ratio:9/16;max-height:70vh;object-fit:contain;background:#111;border-radius:14px;margin-bottom:12px}
  .srow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
  .srow:first-of-type{border-top:0}
  .srow .dot{margin-top:6px}
  .srow p{color:var(--ink2);font-size:14px}
  .srow .fix{color:var(--ink);font-size:14px;margin-top:4px}
  [hidden]{display:none!important}
  /* the site's own menu, copied from index.html (desktop pill + footer-style cream card on mobile). Keep in sync. */
  .site-header{position:fixed;top:0;left:0;right:0;z-index:120;padding:calc(16px + env(safe-area-inset-top)) 0 16px}
  .site-header .wrap{max-width:2200px;margin:0 auto;padding:0 var(--gutter)}
  .site-header .nav{position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;border-radius:100px}
  .site-header .nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.6);backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%);z-index:-1}
  .site-header a{text-decoration:none}
  .brand{display:inline-flex;align-items:center;gap:11px;color:var(--ink)}
  .brand .mark{width:32px;height:32px}
  .brand .wordmark{font:600 19px/1 Manrope,Inter,sans-serif;letter-spacing:-.02em}
  .spark{display:inline-block;width:.72em;height:.72em;fill:currentColor}
  .c-red{color:var(--r)}.c-blue{color:var(--b)}.c-yellow{color:var(--y)}.c-green{color:var(--g)}
  .nav-links{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nav-links a{padding:9px 15px;border-radius:100px;font-size:15px;color:var(--ink2);display:inline-flex;align-items:center;gap:11px;transition:color .25s,background .25s}
  .nav-links a:hover{color:var(--ink);background:rgba(0,0,0,.05)}
  .nav-links a .nav-spark,.nav-links .only-mobile,.nav-h,.nav-mark{display:none}
  .nav-links a.nav-cta{margin-left:6px;padding:11px 20px;color:#fff;background:var(--ink);transition:background .16s}
  .nav-links a.nav-cta:hover{background:var(--r);color:#fff}
  .nav-cta svg{width:15px;height:15px;fill:currentColor}
  .nav-studio{flex:none;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin-left:8px;border-radius:50%;border:1px solid var(--ink);background:var(--ink);color:#fff}
  .nav-studio svg{width:18px;height:18px}
  .nav-scrim{position:fixed;inset:0;z-index:100;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .34s var(--ease),visibility .34s}
  .nav-toggle{display:none;background:none;border:0;color:var(--ink);padding:8px;border-radius:0;z-index:2}
  .nav-toggle .bars{display:block;width:24px;height:16px;position:relative}
  .nav-toggle .bars i{position:absolute;left:0;right:0;height:2px;background:currentColor;border-radius:2px;transition:transform .4s var(--ease),opacity .2s}
  .nav-toggle .bars i:nth-child(1){top:0}.nav-toggle .bars i:nth-child(2){top:7px}.nav-toggle .bars i:nth-child(3){top:14px}
  .nav.open .nav-toggle .bars i:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav.open .nav-toggle .bars i:nth-child(2){opacity:0}
  .nav.open .nav-toggle .bars i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  @media (max-width:860px){
    .nav-toggle{display:inline-flex}
    .nav-studio{margin-left:auto;margin-right:6px;width:40px;height:40px}
    .nav-links{position:fixed;top:calc(var(--head) + env(safe-area-inset-top));left:var(--gutter);right:var(--gutter);bottom:var(--gutter);z-index:119;flex-direction:column;align-items:flex-start;gap:clamp(2px,.5vh,7px);padding:clamp(24px,6vw,46px);background:var(--cream);border-radius:var(--rad-lg);overflow:hidden;opacity:0;transform:translateY(-10px) scale(.99);transform-origin:top center;visibility:hidden;pointer-events:none;transition:opacity .34s var(--ease),transform .42s var(--ease),visibility .34s}
    .nav.open .nav-links{opacity:1;transform:none;visibility:visible;pointer-events:auto}
    .site-header:has(.nav.open) ~ .nav-scrim{opacity:1;visibility:visible;pointer-events:auto}
    .nav-links>*{position:relative;z-index:1}
    .nav-h{display:block;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 clamp(6px,1.2vh,12px)}
    .nav-links a{padding:clamp(2px,.55vh,6px) 0;font-size:clamp(1.12rem,4.9vw,1.42rem);font-weight:500;line-height:1.16;border-radius:0;gap:0}
    .nav-links a .nav-spark{display:inline-block;width:0;height:.72em;opacity:0;flex:0 0 auto;transform:scale(.5) rotate(-40deg);transition:width .3s var(--ease),opacity .3s var(--ease),margin-right .3s var(--ease),transform .4s cubic-bezier(.34,1.56,.64,1)}
    .nav-links a:hover .nav-spark{width:.72em;opacity:1;margin-right:9px;transform:none}
    .nav-links a.only-mobile{display:inline-flex}
    .nav-links a:hover{background:none;color:var(--ink)}
    .nav-links a.nav-cta{display:none}
    .nav-links .nav-socials{display:flex;gap:18px;margin-top:clamp(16px,2.6vh,26px)}
    .nav-socials a{padding:0;color:var(--ink);transition:color .25s var(--ease),transform .25s var(--ease)}
    .nav-socials a span{display:none}
    .nav-socials a svg{width:24px;height:24px}
    .nav-socials a:hover{transform:translateY(-2px)}
    .nav-socials a:nth-child(1):hover{color:var(--b)}.nav-socials a:nth-child(2):hover{color:var(--r)}.nav-socials a:nth-child(3):hover{color:var(--y)}
    .nav-mark{display:block;position:absolute;left:50%;bottom:0;z-index:0;width:clamp(220px,62vw,380px);height:auto;transform:translate(-50%,50%);color:#e5e2d7;pointer-events:none}
    .nav-links>*:not(.nav-mark){opacity:0;transform:translateY(6px);transition:opacity .38s var(--ease),transform .42s var(--ease)}
    .nav.open .nav-links>*:not(.nav-mark){opacity:1;transform:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="/" aria-label="Open Frame home"><svg class="mark" viewBox="0 0 120 120" fill="none" aria-hidden="true"><path d="M74 22 H36 A14 14 0 0 0 22 36 V84 A14 14 0 0 0 36 98 H84 A14 14 0 0 0 98 84 V48" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(60,60) scale(0.42)"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z" fill="currentColor"/></g></svg><span class="wordmark">Open&nbsp;Frame</span></a>

        <span class="nav-h">Pages</span>
        <a class="only-mobile" href="/"><svg class="nav-spark spark c-red" viewBox="-52 -52 104 104" aria-hidden="true"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z"/></svg>Home</a>
        <a href="/work"><svg class="nav-spark spark c-blue" viewBox="-52 -52 104 104" aria-hidden="true"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z"/></svg>Work</a>
        <a href="/services"><svg class="nav-spark spark c-yellow" viewBox="-52 -52 104 104" aria-hidden="true"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z"/></svg>Services</a>

<script>
// The Open Frame Hub (Google Apps Script web app, ends in /exec). Source: hub/Code.gs in grahamivyco/social-assets.
// It checks every request against a signed-in session. No keys live in this page.
const API = 'https://script.google.com/macros/s/AKfycbyBkDfWO-LghULYws9PCWUuqyga7kbGz2cat0w8tMIw09DmoEgtxBB7XprqRfCUyfGhpg/exec';
const STORE = 'of-studio';
{ const nav = document.querySelector('.site-header .nav'), tog = nav.querySelector('.nav-toggle');
  tog.addEventListener('click', () => tog.setAttribute('aria-expanded', nav.classList.toggle('open')));

// The card code (runQueue, build, ...) comes from the Hub, so this page and the Hub's own check-in page always match.
// It expects BOOT, K and call(fn, K, ...args). K stays empty here: the Hub adds the admin key after checking the session.
let BOOT = { metaInbox: 'https://business.facebook.com/latest/inbox/all' };
const K = '';
const byId = id => document.getElementById(id);
const mk = (t, attrs, ...kids) => { const e = document.createElement(t); Object.assign(e, attrs || {}); kids.forEach(k => k && e.append(k)); return e; };
const saved = () => { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } };
const keep = s => { try { s ? localStorage.setItem(STORE, s) : localStorage.removeItem(STORE); } catch (e) {} };

async function post(body) {
  // A plain-text body keeps this a simple request, so the browser sends no preflight Apps Script can't answer.
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ fn: 'studio' }, body)) });
  const d = await r.json();
  if (d.error) { const e = new Error(d.error); e.known = true; e.signedOut = !!d.signedOut; throw e; }
  return d;
}
function call(fn, key, ...args) {
  return post({ op: 'call', s: saved(), name: fn, args }).then(d => d.out, e => {
    if (e.signedOut) { keep(''); signIn('Please sign in again.'); }
    else alert(e.known ? e.message : 'That didn\'t go through. Try again in a minute.');
    throw e;
  });
}

let loaded = '';
function loadCards(role) {
  if (loaded === role) return Promise.resolve();
  if (loaded) { location.reload(); return new Promise(() => {}); }
  // fetch (no Google cookies) instead of <script src>: a browser signed in to several Google accounts gets an
  // error page from Apps Script for cookie-carrying requests, which is what broke the card code loading.
  return fetch(API + '?api=studio_js&r=' + role, { credentials: 'omit' }).then(r => r.ok ? r.text() : Promise.reject())
    .then(code => {
      if (/^\s*</.test(code)) throw 0;   // an HTML error page, not the card code
      const s = document.createElement('script');
      s.textContent = code;
      document.head.append(s);
      loaded = role;
    }).catch(() => { throw new Error('The Hub didn\'t answer.'); });
}

// ---------- sign in ----------

// Signed out shows the full-screen bento (card + tile art); signed in shows the hub column.
function stage(on) { byId('stage').hidden = !on; byId('hub').hidden = on; art(on); }
const SPK = '<svg viewBox="-52 -52 104 104" aria-hidden="true"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z"/></svg>';
function head(word) {

function signIn(msg) {

  byId('more').textContent = ''; byId('count').textContent = ''; byId('out').hidden = true; byId('me').textContent = '';

    e.preventDefault();
    const v = email.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(v)) { err.textContent = 'Please check your email address.'; err.hidden = false; return; }
    go.disabled = true; go.textContent = 'Sending...';
    post({ op: 'ask', email: v }).then(() => askCode(v), x => { go.disabled = false; go.textContent = 'Email me a code'; err.textContent = x.known ? x.message : 'That didn\'t go through. Try again in a minute.'; err.hidden = false; });
  };
  const g = mk('div', { className: 'gsi', hidden: true });
  const or = mk('p', { className: 'or mute', hidden: true, textContent: 'or use your email' });
  box.append(...head(['Your ', 'studio.']), mk('p', { className: 'lead', textContent: 'Everything we\'re working on together, in one place.' }), g, or, form);
  googleButton(g, or, err);
  if (matchMedia('(hover:hover)').matches) email.focus();
}

// Sign in with Google, when the Hub has a client ID (GOOGLE_CLIENT_ID). Google's script draws its own button.
let gConfig = null;
function googleButton(el, or, err) {
  (gConfig || (gConfig = post({ op: 'config' }).catch(() => ({})))).then(c => {
    if (!c.google) return;
    const draw = () => {
      google.accounts.id.initialize({ client_id: c.google, ux_mode: 'popup', callback: r => post({ op: 'google', credential: r.credential }).then(start, x => { err.textContent = x.known ? x.message : 'That didn\'t go through. Try again.'; err.hidden = false; }) });
      // show it first so it can be measured: the email field's width (Google's button tops out at 400px)
      el.hidden = false; or.hidden = false;
      google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: Math.max(200, Math.min(el.clientWidth, 400)) });
    };
    if (window.google && google.accounts) return draw();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = draw;
    document.head.append(s);
  });
}

function askCode(email) {
  stage(true);
  const box = byId('sign'); box.textContent = '';
  const err = mk('p', { className: 'err', hidden: true });
  const code = mk('input', { className: 'code', inputMode: 'numeric', autocomplete: 'one-time-code', maxLength: 6, placeholder: '······', pattern: '[0-9]*' });
  code.setAttribute('aria-label', '6-digit code');
  const go = mk('button', { className: 'yes', type: 'submit', textContent: 'Sign in' });
  const form = mk('form', {}, code, err, go);
  const send = () => {
    go.disabled = true;
    post({ op: 'code', email, code: code.value }).then(start, x => { go.disabled = false; err.textContent = x.known ? x.message : 'That didn\'t go through. Try again.'; err.hidden = false; code.select(); });
  };
  form.onsubmit = e => { e.preventDefault(); send(); };
  code.oninput = () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); if (code.value.length === 6) send(); };
  const back = mk('button', { className: 'skip', type: 'button', textContent: 'Use a different email' });
  back.onclick = () => signIn();
  box.append(...head(['Check your ', 'email.']), mk('p', { className: 'lead', textContent: 'I sent a 6-digit code to ' + email + '. Type it here or tap the button in the email. It works for 15 minutes.' }), form, back);
  code.focus();
}

function start(d) {

  card.append(mk('p', { className: 'label' }, mk('b', { textContent: p.project }), where ? ' · ' + where : ''));

// ---------- results (admins) ----------

const DOTS = ['var(--r)', 'var(--b)', 'var(--y)', 'var(--g)'];

function scriptCard(sc, redraw) {

  const box = byId('reels');
  if (!box.firstChild) box.innerHTML = '<p class="mute">Loading Reels...</p>';
  clearTimeout(reelTimer);
  return call('studioReels', K).then(R => {
    box.textContent = '';
    const redraw = () => showReels();
    box.append(macLine(R.mac, () => showTab('status')));
    if (R.drafts.length) {
      box.append(mk('h2', { className: 'h2' }, 'Reel ', mk('em', { textContent: 'drafts' })));
      R.drafts.forEach(g => box.append(draftCard(g, redraw)));
    }
    box.append(mk('h2', { className: 'h2' }, 'Scripts to ', mk('em', { textContent: 'film' })));
    const types = mk('div', { className: 'types', role: 'tablist' });
    Object.keys(R.types).forEach(t => {
      const n = R.scripts.filter(x => x.type === t).length;
      const b = mk('button', { type: 'button', role: 'tab' }, R.types[t], n ? mk('b', { textContent: n }) : '');
      b.setAttribute('aria-selected', String(t === reelType));
      b.onclick = () => { reelType = t; showReels(); };
      types.append(b);
    });
    box.append(types);
    const waiting = R.asks.indexOf(reelType) >= 0;
    const ask = mk('button', { className: 'ask-new', type: 'button', disabled: waiting,
      textContent: waiting ? 'Writing 3 new scripts. They show up here in a few minutes.' : 'Write 3 new ' + (reelType === 'of' ? 'Open Frame' : R.types[reelType].toLowerCase()) + ' scripts' });
    ask.onclick = () => {
      const note = prompt('Anything they should be about? (optional)', '');
      if (note === null) return;
      ask.disabled = true; ask.textContent = 'Asking...';
      call('adminReelAsk', K, reelType, note).then(redraw, () => { ask.disabled = false; });
    };
    box.append(ask);
    const list = R.scripts.filter(x => x.type === reelType);
    if (!list.length) box.append(mk('div', { className: 'card done' }, mk('p', { textContent: 'No scripts of this type yet. Tap the button above.' })));
    list.forEach(sc => box.append(scriptCard(sc, redraw)));
    // While scripts are being written or rewritten, look again every 30 seconds.
    if (R.asks.length || R.scripts.some(x => x.status === 'change')) reelTimer = setTimeout(() => { if (!byId('reels').hidden) showReels(); }, 30000);
  }, () => { box.innerHTML = '<p class="mute">Reels didn\'t load. Try again in a minute.</p>'; });
}

// ---------- status (admins) ----------
function showStatus() {
  const box = byId('status');
  box.innerHTML = '<p class="mute">Checking...</p>';
  call('studioStatus', K).then(S => {
    box.textContent = '';
    const m = S.mac;
    const mac = mk('div', { className: 'sect' }, mk('h3', {}, mk('i', { className: 'dot ' + (m.stale ? 'stale' : 'ok') }), 'Your Mac'));
    mac.append(mk('p', { className: 'mute', textContent: m.never ? 'The Mac helper isn\'t set up yet.' : m.stale ? 'No word since ' + m.updated + '. The Mac is off or asleep, or the helper stopped. Everything here picks up again when it wakes.' : 'Checked ' + m.updated + '. Anything that stops gets restarted within 2 minutes.' }));
    m.rows.forEach(r => mac.append(mk('div', { className: 'srow' }, mk('i', { className: 'dot ' + (m.stale ? 'stale' : r.status) }),
      mk('div', {}, mk('b', { textContent: r.label }), mk('p', { textContent: (r.status === 'ok' ? '' : (LIGHT[r.status] || r.status) + '. ') + (r.detail || '') }), r.status === 'fail' && r.fix ? mk('p', { className: 'fix', textContent: r.fix }) : ''))));
    box.append(mac);
    const n8n = mk('div', { className: 'sect' }, mk('h3', {}, mk('i', { className: 'dot ' + (S.n8nStale ? 'stale' : 'ok') }), 'Workflows (n8n)'));
    n8n.append(mk('p', { className: 'mute', textContent: S.n8nLast ? (S.n8nStale ? 'The hourly check last ran ' + S.n8nLast + '. n8n may be stopped.' : 'Checked ' + S.n8nLast + '.') : 'No health check yet.' }));
    S.n8n.forEach(r => n8n.append(mk('div', { className: 'srow' }, mk('i', { className: 'dot ' + (r.status === 'ok' ? 'ok' : r.status === 'warn' ? 'fixing' : 'fail') }),
      mk('div', {}, mk('b', { textContent: r.label }), mk('p', { textContent: r.detail || '' }), r.status !== 'ok' && r.link ? mk('a', { href: r.link, target: '_blank', rel: 'noopener', className: 'fix', textContent: 'Open' }) : ''))));
    box.append(n8n);
  }, () => { box.innerHTML = '<p class="mute">Status didn\'t load. Try again in a minute.</p>'; });
}

// ---------- tile art ----------
// The showreel's Bauhaus tile wave: tiles pop in from the top-left, then every few seconds a
// quarter-turn ripples across them. The tile in the middle holds the Open Frame mark. Static under reduced motion.
const art = (() => {
  const cv = byId('art'), ctx = cv.getContext('2d');
  const R = '#f24333', Y = '#f4bf3a', B = '#2f6bf0', G = '#33ac66', INK = '#111110', CREAM = '#f3f1ea';
  const PAL = [R, Y, B, INK, CREAM, G];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const c1 = 1.70158, c2 = c1 * 1.525, c3 = c1 + 1;
  const eOutBack = x => 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  const eIOBack = x => x < .5 ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2 : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2;
  const FRAME = new Path2D('M74 22 H36 A14 14 0 0 0 22 36 V84 A14 14 0 0 0 36 98 H84 A14 14 0 0 0 98 84 V48');
  const SPARK = new Path2D('M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z');
  let W = 0, H = 0, COLS = 0, ROWS = 0, MC = 0, MR = 0, raf = 0, t0 = 0, on = false;
  const EVERY = 3.2; // seconds between quarter-turn waves
  // Everything is drawn in device pixels and every cell edge lands on a whole pixel, so neighbouring
  // tiles meet exactly (fractional edges let the canvas blend colours and left thin seams). The grid
  // fills the panel exactly: cells are as close to square as whole rows and columns allow.
  let XS = [], YS = [];
  function size() {
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    if (!r.width || !r.height) { W = 0; return; }
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); ctx.setTransform(1, 0, 0, 1, 0, 0);
    W = cv.width; H = cv.height;
    // pick the grid whose cells come closest to square, with tiles roughly 110-260px wide
    let best = 9;
    for (let c = 3; c <= 12; c++) {
      const cw = r.width / c; if (cw < 110 || cw > 260) continue;
      const rows = Math.max(3, Math.round(r.height / cw)), err = Math.abs(Math.log((r.height / rows) / cw));
      if (err < best) { best = err; COLS = c; ROWS = rows; }
    }
    if (best === 9) { COLS = Math.max(3, Math.round(r.width / 170)); ROWS = Math.max(3, Math.round(r.height / (r.width / COLS))); }
    XS = Array.from({ length: COLS + 1 }, (_, i) => Math.round(i * W / COLS));
    YS = Array.from({ length: ROWS + 1 }, (_, i) => Math.round(i * H / ROWS));
    MC = Math.floor(COLS / 2); MR = Math.floor(ROWS / 2);
  }
  function tile(c, r, t) {
    const k = (c * 5 + r * 3) % 6, bgc = PAL[k], m0 = PAL[(k + 2 + ((c + r) % 3)) % 6], mc = m0 === bgc ? PAL[(k + 3) % 6] : m0;
    const type = (c * 2 + r * 3) % 4, d = (c + r) / (COLS + ROWS - 2) * .6;
    const s = still ? 1 : eOutBack(seg(t, .1 + d, .55 + d));
    if (s <= .001) return;
    let wave = 0;
    if (!still && t > 1.6) { const n = Math.floor((t - 1.6) / EVERY), f = (t - 1.6) - n * EVERY; wave = n + eIOBack(seg(f, d, d + .5)); }
    const turns = ((c * 3 + r) % 4) + ((c + r) % 2 ? 1 : -1) * wave;
    // a whole number of quarter turns: rotate exactly (sin/cos of k*PI/2 leave tiny errors that blur edges)
    const q = Math.round(turns), at = Math.abs(turns - q) < 1e-6 && s === 1;
    const x0 = XS[c], x1 = XS[c + 1], y0 = YS[r], y1 = YS[r + 1], T = x1 - x0;
    ctx.save();
    if (at) { ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip(); }
    ctx.translate((x0 + x1) / 2, (y0 + y1) / 2); ctx.scale(s, s * (y1 - y0) / T);
    if (c === MC && r === MR) { // the mark tile: cream with the ink frame; its spark turns with each wave
      ctx.fillStyle = CREAM; ctx.fillRect(-T / 2 - 1, -T / 2 - 1, T + 2, T + 2);
      ctx.scale(1, T / (y1 - y0)); // keep the mark itself unstretched
      const k2 = T / 120 * .62; ctx.scale(k2, k2); ctx.translate(-60, -60);
      ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.lineCap = ctx.lineJoin = 'round'; ctx.stroke(FRAME);
      ctx.translate(60, 60); ctx.rotate(Math.PI / 2 * wave); ctx.scale(.42, .42); ctx.fillStyle = INK; ctx.fill(SPARK);
      ctx.restore(); return;
    }
    if (at) { const qq = ((q % 4) + 4) % 4; ctx.transform([1, 0, -1, 0][qq], [0, 1, 0, -1][qq], [0, -1, 0, 1][qq], [1, 0, -1, 0][qq], 0, 0); }
    else { ctx.rotate(turns * Math.PI / 2); ctx.beginPath(); ctx.rect(-T / 2, -T / 2, T, T); ctx.clip(); }
    // shapes overshoot the cell by 2px on the sides they share with it; the clip trims them flush
    const h = T / 2, o = 2;
    ctx.fillStyle = bgc; ctx.fillRect(-h - o, -h - o, T + 2 * o, T + 2 * o);
    ctx.fillStyle = mc; ctx.beginPath();
    if (type === 0) { ctx.moveTo(-h - o, -h - o); ctx.lineTo(h, -h - o); ctx.arc(-h, -h, T, 0, Math.PI / 2); ctx.lineTo(-h - o, h); ctx.closePath(); }
    else if (type === 1) { ctx.arc(0, h, h, Math.PI, 0); ctx.lineTo(h, h + o); ctx.lineTo(-h, h + o); ctx.closePath(); }
    else if (type === 2) { ctx.arc(0, 0, T * .34, 0, Math.PI * 2); }
    else { ctx.moveTo(-h - o, -h - o); ctx.lineTo(h + o, -h - o); ctx.lineTo(-h - o, h + o); ctx.closePath(); }
    ctx.fill();
    if (type === 2) { ctx.fillStyle = bgc; ctx.beginPath(); ctx.arc(0, 0, T * .12, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  function draw(t) { if (!W) return; ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H); for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) tile(c, r, t); }
  function loop(now) { if (!on) return; if (!document.hidden) draw((now - t0) / 1000); raf = requestAnimationFrame(loop); }
  new ResizeObserver(() => { if (!on) return; size(); if (still) draw(99); }).observe(cv);
  return show => {
    if (show && !on) { on = true; size(); t0 = performance.now(); if (still) draw(99); else raf = requestAnimationFrame(loop); }
    else if (!show && on) { on = false; cancelAnimationFrame(raf); }
  };
})();

// ---------- boot ----------
// A sign-in link from the email lands here as #t=...; it's used once and wiped from the address bar.
const link = (location.hash.match(/^#t=([0-9a-f]{64})$/) || [])[1];
if (location.hash) history.replaceState(null, '', location.pathname);
addEventListener('hashchange', () => { if (/^#t=/.test(location.hash)) location.reload(); });
if (API.indexOf('/exec') < 0 || link || saved()) byId('hub').hidden = false;
if (API.indexOf('/exec') < 0) byId('box').innerHTML = '<p class="mute">Not set up yet.</p>';
else if (link) post({ op: 'link', token: link }).then(start, x => signIn(x.known ? x.message : ''));
else if (saved()) post({ op: 'me', s: saved() }).then(start, x => { if (x.signedOut) keep(''); signIn(x.signedOut ? '' : 'Can\'t reach the Hub right now. Try again in a minute.'); });
else signIn();
</script>
</body>
</html>
