<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio · Open Frame</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111110;--ink2:#4b4a46;--muted:#84827b;--cream:#f3f1ea;--line:#e2ded2;--r:#f24333;--b:#2f6bf0;--y:#f4bf3a;--g:#33ac66}
  *{box-sizing:border-box;margin:0}
  body{background:var(--cream);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  header svg{width:34px;height:34px;flex:none}
  header .who{flex:1;min-width:0}
  .eyebrow{font:600 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
  header h1{font:500 22px/1.2 Fraunces,serif;margin-top:4px;overflow-wrap:anywhere}
  .count{font-size:14px;color:var(--ink2);white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{flex:1;padding:10px 12px;font-size:15px;border-color:var(--line);background:transparent}
  .tabs button[aria-selected="true"]{background:#fff;border-color:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
  .label{font-size:13px;color:var(--ink2);margin-bottom:12px}.label b{color:var(--ink);font-weight:600}
  .media{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -4px 14px;padding:0 4px}
  .media img,.media video{width:100%;max-height:460px;object-fit:contain;border-radius:12px;background:#ebe7dc;flex:none;scroll-snap-align:center}
  .media.many img,.media.many video,.media.many figure{width:86%;flex:none}
  .text{white-space:pre-wrap;font-size:15px;margin-bottom:8px;overflow-wrap:anywhere}
  .quote{background:var(--cream);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:15px;margin:8px 0;overflow-wrap:anywhere}
  .note{background:#fdf3d8;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
  a,.link{color:var(--ink)}
  .ask{font:500 19px/1.3 Fraunces,serif;margin:16px 0 12px}
  .ask:empty{margin:8px 0 0}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:500 16px/1.2 Inter,sans-serif;border-radius:100px;padding:15px 12px;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
  button.yes{background:var(--ink);color:var(--cream)}
  button:disabled{opacity:.5;cursor:default}
  .skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink2);font-size:14px;padding:6px;text-decoration:underline}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;background:#fff;color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--ink)}
  input.code{font:500 28px/1 Fraunces,serif;letter-spacing:.3em;text-align:center}
  .done{text-align:center;padding:40px 20px}
  .done h2,.sign h2{font:500 26px/1.2 Fraunces,serif;margin-bottom:8px}
  .done h2 em,.sign h2 em{font-weight:400}
  .done p,.sign p{color:var(--ink2)}
  .sign{padding:28px 22px}
  .sign p{margin-bottom:18px}
  .sign button{width:100%}
  .err{color:var(--r);font-size:14px;margin:-4px 0 12px}
  .more,#results{margin-top:24px;font-size:15px;color:var(--ink2)}
  .more>p{margin-bottom:8px}
  .mute{color:var(--muted);font-size:14px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
  .tile b{display:block;font:500 24px/1.2 Fraunces,serif;color:var(--ink)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .row span:first-child{min-width:0;overflow-wrap:anywhere}
  .sect .row>:last-child{flex:none;white-space:nowrap;text-align:right}
  .sect{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
  .sect h3{font:500 19px/1.25 Fraunces,serif;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .sect h3 i{width:9px;height:9px;border-radius:50%;flex:none}
  .sect .row:first-of-type{border-top:0}
  .big{font:500 30px/1.1 Fraunces,serif;color:var(--ink)}
  footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
  footer a,footer button{color:var(--muted);font-size:13px}
  footer button{background:none;border:0;padding:4px;text-decoration:underline}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="14 14 92 92" aria-label="Open Frame">
      <path d="M74 22 H36 A14 14 0 0 0 22 36 V84 A14 14 0 0 0 36 98 H84 A14 14 0 0 0 98 84 V48" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(60,60) scale(0.46)"><path d="M0 -50 C0 -21 21 0 50 0 C21 0 0 21 0 50 C0 21 -21 0 -50 0 C-21 0 0 -21 0 -50 Z" fill="currentColor"/></g>
    </svg>
    <div class="who"><p class="eyebrow">Studio</p><h1 id="h">&nbsp;</h1></div>
    <span class="count" id="count"></span>
  </header>
  <div class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" aria-selected="true" data-tab="todo">Needs you</button>
    <button role="tab" aria-selected="false" data-tab="results">Results</button>
  </div>
  <div id="todo"><div id="box"><p class="mute">Loading...</p></div><div class="more" id="more"></div></div>
  <div id="results" hidden></div>
  <footer><span id="me"></span> <button id="out" hidden>Sign out</button></footer>
</main>
<script>
// The Open Frame Hub (Google Apps Script web app, ends in /exec). Source: hub/Code.gs in grahamivyco/social-assets.
// It checks every request against a signed-in session. No keys live in this page.
const API = 'https://script.google.com/macros/s/AKfycbyBkDfWO-LghULYws9PCWUuqyga7kbGz2cat0w8tMIw09DmoEgtxBB7XprqRfCUyfGhpg/exec';
const STORE = 'of-studio';

// The card code (runQueue, build, ...) comes from the Hub, so this page and the Hub's own check-in page always match.
// It expects BOOT, K and call(fn, K, ...args). K stays empty here: the Hub adds the admin key after checking the session.
let BOOT = { metaInbox: 'https://business.facebook.com/latest/inbox/all' };
const K = '';
const byId = id => document.getElementById(id);
const mk = (t, attrs, ...kids) => { const e = document.createElement(t); Object.assign(e, attrs || {}); kids.forEach(k => k && e.append(k)); return e; };
const saved = () => { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } };
const keep = s => { try { s ? localStorage.setItem(STORE, s) : localStorage.removeItem(STORE); } catch (e) {} };

async function post(body) {
  // A plain-text body keeps this a simple request, so the browser sends no preflight Apps Script can't answer.
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ fn: 'studio' }, body)) });
  const d = await r.json();
  if (d.error) { const e = new Error(d.error); e.known = true; e.signedOut = !!d.signedOut; throw e; }
  return d;
}
function call(fn, key, ...args) {
  return post({ op: 'call', s: saved(), name: fn, args }).then(d => d.out, e => {
    if (e.signedOut) { keep(''); signIn('Please sign in again.'); }
    else alert(e.known ? e.message : 'That didn\'t go through. Try again in a minute.');
    throw e;
  });
}

let loaded = '';
function loadCards(role) {
  if (loaded === role) return Promise.resolve();
  if (loaded) { location.reload(); return new Promise(() => {}); }
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = API + '?api=studio_js&r=' + role;
    s.onload = () => { loaded = role; ok(); }; s.onerror = () => no(new Error('The Hub didn\'t answer.'));
    document.head.append(s);
  });
}

// ---------- sign in ----------

function signIn(msg) {
  byId('tabs').hidden = true; byId('results').hidden = true; byId('todo').hidden = false;
  byId('more').textContent = ''; byId('count').textContent = ''; byId('out').hidden = true; byId('me').textContent = '';
  byId('h').textContent = 'Sign in';
  const box = byId('box'); box.textContent = '';
  const err = mk('p', { className: 'err', hidden: !msg, textContent: msg || '' });
  const email = mk('input', { type: 'email', autocomplete: 'email', inputMode: 'email', placeholder: 'you@example.com', required: true });
  const go = mk('button', { className: 'yes', type: 'submit', textContent: 'Email me a code' });
  const form = mk('form', {}, email, err, go);
  form.onsubmit = e => {
    e.preventDefault();
    const v = email.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(v)) { err.textContent = 'Please check your email address.'; err.hidden = false; return; }
    go.disabled = true; go.textContent = 'Sending...';
    post({ op: 'ask', email: v }).then(() => askCode(v), x => { go.disabled = false; go.textContent = 'Email me a code'; err.textContent = x.known ? x.message : 'That didn\'t go through. Try again in a minute.'; err.hidden = false; });
  };
  const h = mk('h2', {}, 'Your ', mk('em', { textContent: 'studio.' }));
  box.append(mk('div', { className: 'card sign' }, h, mk('p', { textContent: 'Enter your email. If it has access, a 6-digit code arrives in a minute. No password.' }), form));
  email.focus();
}

function askCode(email) {
  const box = byId('box'); box.textContent = '';
  const err = mk('p', { className: 'err', hidden: true });
  const code = mk('input', { className: 'code', inputMode: 'numeric', autocomplete: 'one-time-code', maxLength: 6, placeholder: '······', pattern: '[0-9]*' });
  const go = mk('button', { className: 'yes', type: 'submit', textContent: 'Sign in' });
  const form = mk('form', {}, code, err, go);
  const send = () => {
    go.disabled = true;
    post({ op: 'code', email, code: code.value }).then(start, x => { go.disabled = false; err.textContent = x.known ? x.message : 'That didn\'t go through. Try again.'; err.hidden = false; code.select(); });
  };
  form.onsubmit = e => { e.preventDefault(); send(); };
  code.oninput = () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); if (code.value.length === 6) send(); };
  const back = mk('button', { className: 'skip', type: 'button', textContent: 'Use a different email' });
  back.onclick = () => signIn();
  const h = mk('h2', {}, 'Check your ', mk('em', { textContent: 'email.' }));
  box.append(mk('div', { className: 'card sign' }, h, mk('p', { textContent: 'Type the code sent to ' + email + ', or tap the button in that email. It works for 15 minutes.' }), form, back));
  code.focus();
}

// ---------- signed in ----------

function start(d) {
  if (d.session) keep(d.session);
  const who = d.who;
  byId('me').textContent = who.email + ' ·';
  byId('out').hidden = false;
  byId('box').innerHTML = '<p class="mute">Loading...</p>';
  const role = who.role === 'admin' ? 'admin' : 'client';
  BOOT = Object.assign(BOOT, { client: who.name });
  return loadCards(role).then(() => {
    if (role === 'client') { byId('h').textContent = who.name; return startClient(); }
    byId('h').textContent = 'Check-in';
    byId('tabs').hidden = false;
    startAdmin();
  }).catch(x => { byId('box').textContent = ''; byId('box').append(mk('div', { className: 'card done' }, mk('h2', { textContent: 'Can\'t reach the Hub' }), mk('p', { textContent: x.message + ' Try again in a minute.' }))); });
}

byId('out').onclick = () => { const s = saved(); keep(''); if (s) post({ op: 'out', s }).catch(() => {}); location.replace(location.pathname); };

// ---------- results (admins) ----------

const DOTS = ['var(--r)', 'var(--b)', 'var(--y)', 'var(--g)'];
let resultsLoaded = false;
byId('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  byId('tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  const r = b.dataset.tab === 'results';
  byId('todo').hidden = r; byId('results').hidden = !r; byId('count').hidden = r;
  if (r && !resultsLoaded) { resultsLoaded = true; showResults(); }
};

function showResults() {
  const box = byId('results');
  box.innerHTML = '<p class="mute">Loading results...</p>';
  call('studioResults', K).then(R => {
    box.textContent = '';
    const n = v => (v == null ? '–' : Math.round(v).toLocaleString('en-US'));
    const chg = (a, b) => (a == null || b == null || b === 0) ? '' : ' (' + (a >= b ? 'up ' : 'down ') + Math.abs(Math.round((a - b) / b * 100)) + '%)';
    R.clients.forEach((c, i) => {
      const x = c.results || {}, s = mk('div', { className: 'sect' });
      s.append(mk('h3', {}, mk('i', { style: 'background:' + DOTS[i % 4] }), c.client));
      if (x.empty || !x.tiles) s.append(mk('p', { className: 'mute', textContent: 'Results show after the first stats pull.' }));
      else {
        const reach = x.tiles.find(t => t.title === 'Accounts reached');
        s.append(mk('p', { className: 'mute', textContent: x.month + ' so far' }), mk('p', { className: 'big', textContent: n(reach && reach.value) }),
          mk('p', { className: 'mute', textContent: 'people reached' + chg(reach && reach.value, reach && reach.prev) }));
        const tiles = mk('div', { className: 'tiles' });
        x.tiles.filter(t => t !== reach).forEach(t => tiles.append(mk('div', { className: 'tile' }, mk('b', { textContent: n(t.value) }), t.title + chg(t.value, t.prev))));
        s.append(tiles);
        if (x.top && x.top.length) {
          s.append(mk('p', { style: 'margin:14px 0 2px;color:var(--ink)', textContent: 'Top posts' }));
          x.top.forEach(p => s.append(mk('div', { className: 'row' }, mk('span', { textContent: p.caption.slice(0, 70) || p.type || 'Post' }), p.url ? mk('a', { href: p.url, target: '_blank', rel: 'noopener', textContent: 'See' }) : '')));
        }
      }
      if (x.newsletter) s.append(mk('p', { className: 'mute', style: 'margin-top:10px', textContent: x.newsletter }));
      if (x.report_url) s.append(mk('p', { style: 'margin-top:10px' }, mk('a', { href: x.report_url, target: '_blank', rel: 'noopener', textContent: 'Monthly report (PDF)' })));
      box.append(s);
    });
    const loops = mk('div', { className: 'sect' }, mk('h3', { textContent: 'Loops, last 7 days' }));
    if (!R.runs.length) loops.append(mk('p', { className: 'mute', textContent: 'No loop runs logged this week. Is the Mac on?' }));
    R.runs.forEach(r => loops.append(mk('div', { className: 'row' },
      mk('span', {}, mk('b', { textContent: r.loop }), mk('br'), mk('span', { className: 'mute', textContent: r.made + ' made, ' + r.kept + ' passed the check, ' + r.cards + ' cards' + (r.failed ? ', ' + r.failed + ' failed' : '') })),
      mk('span', { className: 'mute', textContent: r.last }))));
    box.append(loops);
    if (R.yes.length) {
      const y = mk('div', { className: 'sect' }, mk('h3', { textContent: 'You said yes to' }));
      R.yes.forEach(r => y.append(mk('div', { className: 'row' },
        mk('span', {}, r.title || r.loop, mk('br'), mk('span', { className: 'mute', textContent: [r.client, r.loop, r.status === 'change' ? 'changed' : r.status].filter(Boolean).join(' · ') })),
        r.link ? mk('a', { href: r.link, target: '_blank', rel: 'noopener', textContent: 'Open' }) : mk('span', { className: 'mute', textContent: r.when }))));
      box.append(y);
    }
  }, () => { box.innerHTML = '<p class="mute">Results didn\'t load. Try again in a minute.</p>'; resultsLoaded = false; });
}

// ---------- boot ----------
// A sign-in link from the email lands here as #t=...; it's used once and wiped from the address bar.
const link = (location.hash.match(/^#t=([0-9a-f]{64})$/) || [])[1];
if (location.hash) history.replaceState(null, '', location.pathname);
addEventListener('hashchange', () => { if (/^#t=/.test(location.hash)) location.reload(); });
if (API.indexOf('/exec') < 0) byId('box').innerHTML = '<p class="mute">Not set up yet.</p>';
else if (link) post({ op: 'link', token: link }).then(start, x => signIn(x.known ? x.message : ''));
else if (saved()) post({ op: 'me', s: saved() }).then(start, x => { if (x.signedOut) keep(''); signIn(x.signedOut ? '' : 'Can\'t reach the Hub right now. Try again in a minute.'); });
else signIn();
</script>
</body>
</html>
