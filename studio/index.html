<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Open Frame</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<!-- Studio is paused (2026-11-03). The full page is kept on the branch archive/studio-2026-11. -->
<style>
  :root{--bg:#fff;--ink:#111110;--ink-2:#4b4a46;--panel:#f3f1ea;--blue:#2f6bf0;--r-lg:30px;--pill:100px;--gutter:clamp(18px,4.5vw,76px)}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:400 17px/1.55 Inter,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:var(--gutter)}
  .card{background:var(--panel);border-radius:var(--r-lg);padding:clamp(28px,5vw,64px);max-width:560px;width:100%}
  h1{font:700 clamp(28px,4vw,40px)/1.1 "Helvetica Neue",Helvetica,Arial,sans-serif;margin-bottom:14px}
  p{color:var(--ink-2);margin-bottom:24px}
  a.btn{display:inline-block;padding:12px 22px;border-radius:var(--pill);background:var(--ink);color:#fff;text-decoration:none;font-weight:500;transition:background .25s}
  a.btn:hover{background:var(--blue)}
  a.mail{color:inherit}
  @media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
  <main class="card">
    <h1>Client sign-in is paused.</h1>
    <p>For now I send reviews and approvals to you by email. Questions go to <a class="mail" href="mailto:hello@openframe.design">hello@openframe.design</a>.</p>
    <a class="btn" href="/">Back to Open Frame</a>
  </main>
</body>
</html>
